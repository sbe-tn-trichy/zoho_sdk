<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="review-token" content="__TOKEN__">
  <title>Online Payment Reconciliation</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #64748b;
      --line: #dbe3ed;
      --paper: #fff;
      --bg: #f3f6fa;
      --blue: #155eef;
      --green: #087443;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 20px 28px;
      color: white;
      background: linear-gradient(115deg, #102a56, #155eef);
      box-shadow: 0 3px 16px #102a5630;
    }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; opacity: .8; }
    main { max-width: 1500px; margin: auto; padding: 24px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .card span { display: block; color: var(--muted); font-size: 12px; }
    .card strong { font-size: 24px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    input, select, button { font: inherit; }
    input, select {
      min-height: 38px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 8px 10px;
    }
    input { min-width: 260px; flex: 1; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .refresh, .select { color: var(--blue); background: #eaf1ff; }
    .accept { color: white; background: var(--green); }
    .reject { color: var(--red); background: #feeceb; }
    .table-wrap {
      overflow: auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    table { width: 100%; border-collapse: collapse; min-width: 1150px; }
    th {
      position: sticky;
      top: 0;
      background: #edf2f8;
      color: #475569;
      text-align: left;
      font-size: 12px;
      letter-spacing: .02em;
    }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .money { font-variant-numeric: tabular-nums; font-weight: 700; }
    .muted { color: var(--muted); }
    .ref { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #eef2f6;
      color: #475569;
    }
    .badge.pending { background: #fff4d6; color: #8a5700; }
    .badge.pushed { background: #dff7e9; color: #087443; }
    .badge.rejected { background: #feeceb; color: #b42318; }
    .badge.failed { background: #feeceb; color: #b42318; }
    .actions { display: flex; gap: 7px; white-space: nowrap; }
    .error { margin-top: 5px; max-width: 280px; color: var(--red); font-size: 12px; }
    .allocation { min-width: 230px; }
    .allocation div + div { margin-top: 4px; }
    .warning { color: #9a6700; font-size: 12px; font-weight: 650; }
    .candidate { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); cursor: pointer; }
    .candidate input { min-width: 0; min-height: 0; flex: none; }
    #notice {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 5;
      max-width: 420px;
      color: white;
      background: #15233d;
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 8px 30px #0004;
    }
    @media(max-width: 900px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Payment Reconciliation</h1>
  <p>Review Online and Cheque payment matches across HDFC, ICICI, and IDFC. Nothing is pushed until you accept it.</p>
</header>
<main>
  <section class="summary" id="summary"></section>
  <div class="toolbar">
    <input id="search" placeholder="Search customer, reference, amount, or narration">
    <select id="filter">
      <option value="all">All entries</option>
      <option value="reviewable">Ready for review</option>
      <option value="ambiguous">Ambiguous</option>
      <option value="possible">Possible matches</option>
      <option value="unmatched">Unmatched</option>
      <option value="pending">Pending</option>
      <option value="pushed">Pushed</option>
      <option value="rejected">Rejected</option>
      <option value="failed">Failed</option>
    </select>
    <button class="select" id="selectReady">Select all ready</button>
    <button class="accept" id="acceptSelected" disabled>Accept selected &amp; Push</button>
    <span class="muted" id="selectedCount">0 selected</span>
    <button class="refresh" id="refresh">Refresh live data</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectVisible" title="Select all visible ready matches"></th>
          <th>Status</th>
          <th>Type</th>
          <th>Payment / presented date</th>
          <th>Customer</th>
          <th>Bank</th>
          <th>Amount</th>
          <th>Reference</th>
          <th>Proposed bank line</th>
          <th>Invoice allocation</th>
          <th>Match result</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<div id="notice"></div>

<script>
  const token = document.querySelector('meta[name="review-token"]').content;
  let batch = { entries: [] }, selected = new Set(), candidateSelections = new Map();
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = v => {
    const n = Number(String(v ?? '').replaceAll(',', ''));
    return Number.isFinite(n) ? n.toLocaleString('en-IN', { style: 'currency', currency: 'INR' }) : esc(v);
  };

  function state(e) {
    return e.push_status === 'pushed' ? 'pushed' : e.push_status === 'failed' ? 'failed' : e.decision || 'pending';
  }

  const isAmbiguous = e => (e.ambiguous_candidates || []).length > 1;
  const isPossible = e => !isAmbiguous(e) && (e.possible_candidates || []).length > 0;
  const inProgress = e => ['payment_created', 'match_requested', 'bank_matched', 'creator_updated'].includes(e.push_status);

  function selectedPossibleCandidateId(e) {
    if (e.manual_reference_override && e.bank) return String(e.bank.transaction_id || '');
    const candidates = e.possible_candidates || [], chosen = candidateSelections.get(String(e.id));
    if (chosen && candidates.some(c => String(c.transaction_id) === chosen)) return chosen;
    return candidates.length === 1 ? String(candidates[0].transaction_id || '') : '';
  }

  function eligible(e) {
    const hasCandidate = e.reviewable || (isPossible(e) && selectedPossibleCandidateId(e) && e.creator?.books_customer_id);
    return hasCandidate && state(e) !== 'pushed' && !inProgress(e);
  }

  function bankHtml(e) {
    const b = e.bank;
    if (b) return `${esc(b.date)} · <span class="money">${money(b.amount)}</span><div class="ref">${esc(b.reference)}</div><div class="muted">${esc(b.description)}</div>`;
    const candidates = e.ambiguous_candidates || [];
    if (candidates.length) return `<details open><summary class="warning">${candidates.length} matching bank lines</summary>${candidates.map(c => `<div class="candidate"><strong>${esc(c.bank_name || 'Bank')}</strong> · ${esc(c.date)} · <span class="money">${money(c.amount)}</span><div class="ref">${esc(c.reference)}</div><div class="muted">${esc(c.description)}</div></div>`).join('')}</details>`;
    const possible = e.possible_candidates || [];
    if (possible.length) {
      const chosen = selectedPossibleCandidateId(e);
      return `<details open><summary class="warning">${possible.length} date-and-amount candidate${possible.length === 1 ? '' : 's'} · reference differs</summary>${possible.map(c => `<label class="candidate"><input type="radio" name="possible-${esc(e.id)}" value="${esc(c.transaction_id)}" data-entry-id="${esc(e.id)}" onchange="selectPossibleCandidate(this.dataset.entryId,this.value)" ${chosen === String(c.transaction_id) ? 'checked' : ''}> <strong>${esc(c.bank_name || 'Bank')}</strong> · ${esc(c.date)} · <span class="money">${money(c.amount)}</span><div class="ref">${esc(c.reference)}</div><div class="muted">${esc(c.description)}</div></label>`).join('')}</details>`;
    }
    return '<span class="muted">No candidate</span>';
  }

  function allocationHtml(e) {
    const rows = e.invoice_allocations || [];
    if (!rows.length) return `<span class="muted">${esc(e.allocation_error || 'No allocation recorded')}</span>`;
    const detail = rows.map(a => `<div><strong>${esc(a.invoice_number || a.invoice_id)}</strong> · ${money(a.amount_applied)}<div class="muted">Due ${esc(a.due_date || 'not set')} · balance ${money(a.balance)}</div></div>`).join('');
    const excess = Number(e.unallocated_amount || 0) > 0 ? `<div class="warning">${money(e.unallocated_amount)} will remain unused (invoice balances exhausted)</div>` : '';
    return detail + excess;
  }

  function notify(message, bad = false) {
    const n = document.getElementById('notice');
    n.textContent = message;
    n.style.background = bad ? '#b42318' : '#15233d';
    n.style.display = 'block';
    setTimeout(() => n.style.display = 'none', 5000);
  }

  function render() {
    const entries = batch.entries || [], counts = { total: entries.length, reviewable: 0, ambiguous: 0, possible: 0, pending: 0, pushed: 0, rejected: 0 };
    entries.forEach(e => {
      if (e.reviewable && state(e) !== 'pushed') counts.reviewable++;
      if (isAmbiguous(e)) counts.ambiguous++;
      if (isPossible(e)) counts.possible++;
      const s = state(e);
      if (s in counts) counts[s]++;
    });
    document.getElementById('summary').innerHTML = [
      ['Total', counts.total],
      ['Ready', counts.reviewable],
      ['Ambiguous', counts.ambiguous],
      ['Possible', counts.possible],
      ['Pending', counts.pending],
      ['Pushed', counts.pushed],
      ['Rejected', counts.rejected]
    ].map(x => `<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');

    const q = document.getElementById('search').value.toLowerCase(), filter = document.getElementById('filter').value;
    const shown = entries.filter(e => {
      const s = state(e), hay = JSON.stringify(e).toLowerCase();
      return (!q || hay.includes(q)) && (
        filter === 'all' ||
        (filter === 'reviewable' && e.reviewable && s !== 'pushed') ||
        (filter === 'ambiguous' && isAmbiguous(e)) ||
        (filter === 'possible' && isPossible(e)) ||
        (filter === 'unmatched' && !e.reviewable) ||
        s === filter
      );
    });

    for (const id of [...selected]) {
      const e = entries.find(x => x.id === id);
      if (!e || !eligible(e)) selected.delete(id);
    }

    document.getElementById('rows').innerHTML = shown.map(e => {
      const c = e.creator || {}, b = e.bank, s = state(e), busy = inProgress(e);
      return `<tr>
        <td><input type="checkbox" aria-label="Select payment" ${selected.has(e.id) ? 'checked' : ''} ${eligible(e) ? '' : 'disabled'} onchange="toggleEntry('${esc(e.id)}',this.checked)"></td>
        <td><span class="badge ${esc(s)}">${esc(s)}</span>${e.push_status && e.push_status !== 'not_started' && e.push_status !== s ? `<div class="muted">${esc(e.push_status)}</div>` : ''}${e.error ? `<div class="error">${esc(e.error)}</div>` : ''}</td>
        <td><span class="badge">${esc(e.payment_type || 'Online')}</span></td>
        <td>${esc(c.date)}<div class="muted">${esc(c.payment_id)}</div></td>
        <td>${esc(c.customer_name) || '<span class="muted">Unknown</span>'}</td>
        <td><strong>${esc(e.bank_name) || '<span class="muted">—</span>'}</strong></td>
        <td class="money">${money(c.amount)}</td>
        <td class="ref">${esc(c.reference) || '<span class="muted">Missing</span>'}</td>
        <td>${bankHtml(e)}</td>
        <td class="allocation">${allocationHtml(e)}</td>
        <td>${esc(e.reason)}</td>
        <td>
          <div class="actions">
            <button class="reject" onclick="rejectEntry('${esc(e.id)}')" ${s === 'pushed' || busy || e.books_payment_id ? 'disabled' : ''}>Reject</button>
            <button class="accept" onclick="acceptEntry('${esc(e.id)}')" ${!eligible(e) ? 'disabled' : ''}>Accept &amp; Push</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    const visibleEligible = shown.filter(eligible);
    document.getElementById('selectVisible').checked = visibleEligible.length > 0 && visibleEligible.every(e => selected.has(e.id));
    document.getElementById('selectedCount').textContent = `${selected.size} selected`;
    document.getElementById('acceptSelected').disabled = selected.size === 0;
  }

  async function api(path, method = 'GET', body = {}) {
    const r = await fetch(path, {
      method,
      headers: { 'X-Review-Token': token, 'Content-Type': 'application/json' },
      body: method === 'POST' ? JSON.stringify({ confirm: true, ...body }) : undefined
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  }

  async function load() {
    batch = await api('/api/batch');
    render();
  }

  function toggleEntry(id, checked) {
    if (checked) selected.add(id);
    else selected.delete(id);
    render();
  }

  function selectPossibleCandidate(entryId, transactionId) {
    candidateSelections.set(String(entryId), String(transactionId));
    render();
  }

  function visibleEligible() {
    const q = document.getElementById('search').value.toLowerCase(), filter = document.getElementById('filter').value;
    return (batch.entries || []).filter(e => {
      const s = state(e), hay = JSON.stringify(e).toLowerCase(),
        shown = (!q || hay.includes(q)) && (
          filter === 'all' ||
          (filter === 'reviewable' && e.reviewable && s !== 'pushed') ||
          (filter === 'ambiguous' && isAmbiguous(e)) ||
          (filter === 'possible' && isPossible(e)) ||
          (filter === 'unmatched' && !e.reviewable) ||
          s === filter
        );
      return shown && eligible(e);
    });
  }

  function toggleVisible(checked) {
    for (const e of visibleEligible()) {
      if (checked) selected.add(e.id);
      else selected.delete(e.id);
    }
    render();
  }

  async function rejectEntry(id) {
    if (!confirm('Reject this proposal? This only updates the local review queue.')) return;
    try {
      await api('/api/entries/' + encodeURIComponent(id) + '/reject', 'POST');
      await load();
      notify('Proposal rejected.');
    } catch (e) {
      notify(e.message, true);
    }
  }

  async function acceptEntry(id) {
    const entry = (batch.entries || []).find(e => String(e.id) === String(id));
    const possibleId = entry && isPossible(entry) ? selectedPossibleCandidateId(entry) : '';
    const warning = possibleId ? ' The Creator and bank references differ; this explicitly overrides the reference check.' : '';
    if (!confirm(`Accept and push this payment to Zoho Books now?${warning} Open invoices will be refreshed and allocated oldest-due-first before creation.`)) return;
    try {
      notify('Refreshing invoices and pushing approved payment…');
      await api('/api/entries/' + encodeURIComponent(id) + '/accept', 'POST', {
        bank_transaction_id: possibleId,
        allow_reference_override: Boolean(possibleId)
      });
      await load();
      notify('Payment allocated, pushed, and matched successfully.');
    } catch (e) {
      await load();
      notify(e.message, true);
    }
  }

  async function acceptSelected() {
    const ids = [...selected];
    if (!ids.length) return;
    const selectedBankIds = Object.fromEntries(ids.map(id => {
      const entry = (batch.entries || []).find(e => String(e.id) === String(id));
      return [id, entry && isPossible(entry) ? selectedPossibleCandidateId(entry) : ''];
    }).filter(([, bankId]) => bankId));
    const overrides = Object.keys(selectedBankIds).length;
    const warning = overrides ? ` ${overrides} selection${overrides === 1 ? '' : 's'} will explicitly override a reference mismatch.` : '';
    if (!confirm(`Accept and push ${ids.length} selected payment${ids.length === 1 ? '' : 's'} to Zoho Books?${warning} Each bank match and oldest-due-first invoice allocation is refreshed before posting.`)) return;
    try {
      notify(`Allocating and pushing ${ids.length} selected payments sequentially…`);
      const result = await api('/api/accept-selected', 'POST', {
        entry_ids: ids,
        selected_bank_transaction_ids: selectedBankIds,
        allow_reference_override: overrides > 0
      });
      selected.clear();
      await load();
      const message = `${result.pushed.length} pushed${result.failed.length ? `, ${result.failed.length} failed` : ''}.`;
      notify(message, result.failed.length > 0);
    } catch (e) {
      await load();
      notify(e.message, true);
    }
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filter').addEventListener('change', render);
  document.getElementById('selectVisible').onchange = e => toggleVisible(e.target.checked);
  document.getElementById('selectReady').onclick = () => {
    for (const e of batch.entries || []) {
      if (eligible(e)) {
        selected.add(e.id);
      }
    }
    render();
  };
  document.getElementById('acceptSelected').onclick = acceptSelected;
  document.getElementById('refresh').onclick = async () => {
    if (!confirm('Refresh proposals from live Creator and Books data? Existing decisions are preserved.')) return;
    try {
      notify('Refreshing…');
      batch = await api('/api/refresh', 'POST');
      render();
      notify('Review queue refreshed.');
    } catch (e) {
      notify(e.message, true);
    }
  };
  load().catch(e => notify(e.message, true));
</script>
</body>
</html>
