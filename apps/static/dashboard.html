<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="launcher-token" content="__TOKEN__">
  <title>Zoho SDK Operations</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110f;
      --panel: #0d1a17;
      --panel2: #10221d;
      --ink: #ecf7f2;
      --muted: #92aaa1;
      --line: #203a32;
      --mint: #72f0b6;
      --amber: #ffc66d;
      --red: #ff8178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 85% 0, #12392f 0, transparent 32rem), var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      padding: 54px 0 70px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 34px;
    }
    .eyebrow {
      color: var(--mint);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1 {
      font: 700 clamp(34px, 6vw, 68px)/.98 ui-sans-serif, system-ui;
      margin: 9px 0 13px;
      letter-spacing: -.05em;
      max-width: 720px;
    }
    header p {
      color: var(--muted);
      max-width: 670px;
      margin: 0;
    }
    .pulse {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--mint);
      font-size: 13px;
    }
    .pulse:before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 18px var(--mint);
    }
    .callbox {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 24px;
      box-shadow: 0 18px 70px #0005;
    }
    .callbox input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 8px 10px;
    }
    .callbox input::placeholder { color: #678077; }
    .callbox button, .run {
      border: 0;
      border-radius: 10px;
      background: var(--mint);
      color: #052117;
      font-weight: 800;
      padding: 11px 18px;
      cursor: pointer;
    }
    .callbox button:disabled, .run:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: start;
      background: linear-gradient(150deg, var(--panel2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 19px;
      min-height: 148px;
      transition: .18s transform, .18s border-color;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3b6f5f;
    }
    .num {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid #376052;
      border-radius: 12px;
      color: var(--mint);
      font-size: 20px;
      font-weight: 800;
    }
    .card h2 {
      font: 700 18px/1.25 ui-sans-serif, system-ui;
      margin: 1px 0 7px;
    }
    .card p {
      color: var(--muted);
      margin: 0 0 16px;
      font-size: 13px;
    }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: #b6cbc3;
      font-size: 11px;
    }
    .status {
      grid-column: 2 / -1;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-wrap;
    }
    .status.running { color: var(--amber); }
    .status.succeeded { color: var(--mint); }
    .status.failed { color: var(--red); }
    .open { color: var(--mint); margin-left: 8px; }
    .console {
      margin-top: 24px;
      background: #030807;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .console-head {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0b1512;
      color: var(--muted);
      font-size: 12px;
    }
    .console pre {
      margin: 0;
      padding: 18px;
      min-height: 150px;
      max-height: 340px;
      overflow: auto;
      color: #c5d8d1;
      white-space: pre-wrap;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @media(max-width: 760px) {
      main { padding-top: 30px; }
      header { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .card { grid-template-columns: auto 1fr; }
      .run { grid-column: 1 / -1; }
      .status { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Local operations desk</div>
        <h1>Choose a workflow. Keep the context.</h1>
        <p>Frequently used Zoho jobs are numbered, allowlisted, and launched from this machine. Type a number and press Enter, or use a card.</p>
      </div>
      <div class="pulse">Launcher online</div>
    </header>
    <section class="callbox">
      <input id="call" inputmode="numeric" autocomplete="off" aria-label="Workflow number" placeholder="Call workflow number…">
      <button id="callButton">Run</button>
    </section>
    <section class="grid" id="grid"></section>
    <section class="console">
      <div class="console-head">
        <span id="consoleTitle">Run output</span>
        <span id="consoleState">Waiting</span>
      </div>
      <pre id="logs">Select a workflow to see its output here.</pre>
    </section>
  </main>

  <script>
    const token = document.querySelector('meta[name="launcher-token"]').content;
    let state = { workflows: [], runs: [] }, selectedRun = null;
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function latest(number) {
      return [...state.runs].reverse().find(r => r.workflow_number === number);
    }

    function render() {
      document.getElementById('grid').innerHTML = state.workflows.map(w => {
        const r = latest(w.number), busy = r && ['starting', 'running'].includes(r.status);
        return `<article class="card">
          <div class="num">${w.number}</div>
          <div>
            <h2>${esc(w.name)}</h2>
            <p>${esc(w.description)}</p>
            <div class="meta">
              <span class="tag">${esc(w.category)}</span>
              <span class="tag">${esc(w.safety)}</span>
            </div>
          </div>
          <button class="run" ${busy ? 'disabled' : ''} onclick="run(${w.number})">${busy ? 'Running' : 'Run ' + w.number}</button>
          <div class="status ${esc(r?.status || '')}">${r ? esc(r.status) : 'Not run yet'}${r?.open_url && busy ? ` · <a class="open" href="${esc(r.open_url)}" target="_blank">Open UI ↗</a>` : ''}</div>
        </article>`;
      }).join('');
      showConsole();
    }

    function showConsole() {
      const r = state.runs.find(x => x.run_id === selectedRun) || state.runs.at(-1);
      if (!r) return;
      selectedRun = r.run_id;
      document.getElementById('consoleTitle').textContent = `Run ${r.run_id} · ${r.name}`;
      document.getElementById('consoleState').textContent = r.status;
      const pre = document.getElementById('logs');
      pre.textContent = (r.logs || []).join('\n') || 'Process started. Waiting for output…';
      pre.scrollTop = pre.scrollHeight;
    }

    async function refresh() {
      const response = await fetch('/api/state', { cache: 'no-store' });
      state = await response.json();
      render();
    }

    async function run(number) {
      const response = await fetch('/api/workflows/' + number + '/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Launcher-Token': token },
        body: JSON.stringify({ confirm: true })
      });
      const data = await response.json();
      if (!response.ok) {
        alert(data.error || 'Unable to start workflow');
        return;
      }
      selectedRun = data.run_id;
      await refresh();
      if (data.open_url) setTimeout(() => window.open(data.open_url, '_blank'), 700);
    }

    function call() {
      const number = Number(document.getElementById('call').value);
      if (!state.workflows.some(w => w.number === number)) {
        alert('Enter a workflow number shown below.');
        return;
      }
      run(number);
    }

    document.getElementById('callButton').onclick = call;
    document.getElementById('call').addEventListener('keydown', e => { if (e.key === 'Enter') call(); });
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
