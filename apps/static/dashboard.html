<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="launcher-token" content="__TOKEN__">
  <title>Zoho SDK Operations</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110f;
      --panel: #0d1a17;
      --panel2: #10221d;
      --ink: #ecf7f2;
      --muted: #92aaa1;
      --line: #203a32;
      --mint: #72f0b6;
      --amber: #ffc66d;
      --red: #ff8178;
      --blue: #8ac7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 85% 0, #12392f 0, transparent 32rem), var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    main {
      width: min(1480px, calc(100% - 28px));
      height: 100dvh;
      margin: auto;
      padding: 12px 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 2px 10px;
      scrollbar-width: thin;
    }
    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      padding: 8px 12px;
      font: 600 12px ui-sans-serif, system-ui;
      cursor: pointer;
    }
    .tab[aria-selected="true"] {
      background: var(--mint);
      border-color: var(--mint);
      color: #052117;
    }
    .tab-count { opacity: .7; margin-left: 5px; }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      margin-bottom: 12px;
    }
    .eyebrow {
      color: var(--mint);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1 {
      font: 700 clamp(25px, 3.2vw, 42px)/1 ui-sans-serif, system-ui;
      margin: 5px 0 7px;
      letter-spacing: -.05em;
      max-width: 720px;
    }
    header p {
      color: var(--muted);
      max-width: 670px;
      margin: 0;
    }
    .pulse {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--mint);
      font-size: 13px;
    }
    .pulse:before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 18px var(--mint);
    }
    .callbox {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 6px 8px;
      margin: 0;
      box-shadow: 0 18px 70px #0005;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 0 8px;
    }
    .toolbar h2 { margin: 0; font: 700 17px ui-sans-serif, system-ui; }
    .count { color: var(--muted); font-size: 12px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .filter {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 4px 9px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }
    .filter.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .callbox input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 6px 9px;
    }
    .callbox input::placeholder { color: #678077; }
    .callbox button, .run {
      border: 0;
      border-radius: 10px;
      background: var(--mint);
      color: #052117;
      font-weight: 800;
      padding: 11px 18px;
      cursor: pointer;
    }
    .callbox button:disabled, .run:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .run.setup { background: #1a302a; color: #9eb6ad; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(60px, auto);
      align-content: start;
      gap: 5px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 3px;
    }
    .card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      background: linear-gradient(150deg, var(--panel2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px 8px;
      min-height: 0;
      transition: .18s transform, .18s border-color;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3b6f5f;
    }
    .favorite {
      border: 0;
      background: transparent;
      color: #68857a;
      padding: 3px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .favorite[aria-pressed="true"] { color: var(--amber); }
    .card-actions { display: flex; align-items: center; gap: 5px; }
    .empty {
      color: var(--muted);
      padding: 20px 12px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
    }
    .num {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid #376052;
      border-radius: 8px;
      color: var(--mint);
      font-size: 13px;
      font-weight: 800;
    }
    .card h2 {
      font: 700 13px/1.1 ui-sans-serif, system-ui;
      margin: 0 0 2px;
    }
    .card p {
      color: var(--muted);
      margin: 0 0 5px;
      font-size: 10px;
      line-height: 1.25;
      display: none;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 6px;
      color: #b6cbc3;
      font-size: 9px;
    }
    .status {
      grid-column: 2 / -1;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
      display: none;
      white-space: pre-wrap;
    }
    .status.running { color: var(--amber); }
    .status.succeeded { color: var(--mint); }
    .status.failed { color: var(--red); }
    .open { color: var(--mint); margin-left: 8px; }
    .setup-note { color: var(--blue); }
    .console {
      position: static;
      width: auto;
      height: 100%;
      min-height: 0;
      background: #030807;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 70px #0005;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .console-head {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0b1512;
      color: var(--muted);
      font-size: 12px;
    }
    .console pre {
      margin: 0;
      padding: 18px;
      min-height: 0;
      max-height: none;
      overflow: auto;
      color: #c5d8d1;
      white-space: pre-wrap;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .head-actions { display: flex; align-items: center; gap: 14px; }
    .output-toggle, .console-close {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--ink);
      padding: 7px 10px;
      cursor: pointer;
    }
    @media(max-width: 1100px) {
      main { width: calc(100% - 16px); padding: 8px 0; }
      .workspace { grid-template-columns: minmax(320px, 42%) minmax(0, 1fr); }
    }
    @media(max-width: 900px) {
      .workspace { grid-template-columns: minmax(280px, 46%) minmax(0, 1fr); }
      .card { grid-template-columns: 24px 1fr auto; padding: 4px 6px; }
      .num { width: 24px; height: 24px; }
      .tag:nth-child(2) { display: none; }
    }
    @media(max-height: 720px) {
      header p, .toolbar { display: none; }
      .filters { margin-bottom: 5px; }
      .card p { -webkit-line-clamp: 1; }
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 38%) minmax(0, 1fr);
      gap: 10px;
      min-height: 0;
    }
    .workflow-list {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      min-height: 0;
    }
    .workflow-list .grid { height: 100%; }
    .run { padding: 6px 10px; font-size: 11px; }
    @media(max-width: 1100px) {
      .workspace { grid-template-columns: minmax(320px, 42%) minmax(0, 1fr); }
    }
    @media(max-width: 900px) {
      .workspace { grid-template-columns: minmax(280px, 46%) minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Workflow groups"></nav>
    <section class="workspace">
      <div class="workflow-list">
        <section class="callbox">
          <input id="call" autocomplete="off" aria-label="Find a workflow" placeholder="Find a workflow…">
          <button id="callButton">Find</button>
        </section>
        <section class="grid" id="grid"></section>
      </div>
      <section class="console">
        <div class="console-head">
          <span id="consoleTitle">Run output</span>
          <span id="consoleState">Waiting</span>
        </div>
        <pre id="logs">Select a workflow to see its output here.</pre>
      </section>
    </section>
  </main>

  <script>
    const token = document.querySelector('meta[name="launcher-token"]').content;
    let state = { workflows: [], runs: [] }, selectedRun = null, activeTab = 'All', query = '';
    const favoritesKey = 'zoho-sdk-dashboard-favorites';
    let favorites = new Set();
    try { favorites = new Set(JSON.parse(localStorage.getItem(favoritesKey) || '[]').map(Number)); } catch (_) { /* Browser storage may be unavailable. */ }
    if (favorites.size) activeTab = 'Favorites';
    const reconciliationWorkflows = new Set([
      'collection_reconciliation',
      'vendor_ledger_reconciliation', 'vendor_customer_offset'
    ]);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function inTab(workflow, tab) {
      if (tab === 'Favorites') return favorites.has(workflow.number);
      if (tab === 'All') return true;
      if (tab === 'Reconciliation') return reconciliationWorkflows.has(workflow.workflow);
      return workflow.category === tab;
    }

    function renderTabs() {
      const categories = [...new Set(state.workflows.map(w => w.category))]
        .filter(category => category !== 'Reconciliation').sort();
      const tabs = ['Favorites'];
      if (state.workflows.some(w => inTab(w, 'Reconciliation'))) tabs.push('Reconciliation');
      tabs.push(...categories, 'All');
      if (!tabs.includes(activeTab)) activeTab = 'All';
      const nav = document.getElementById('tabs');
      const hadFocus = nav.contains(document.activeElement);
      const scrollLeft = nav.scrollLeft;
      nav.innerHTML = tabs.map((tab, index) => {
        const count = state.workflows.filter(w => inTab(w, tab)).length;
        return `<button class="tab" type="button" role="tab" id="tab-${index}"
          aria-selected="${tab === activeTab}" tabindex="${tab === activeTab ? '0' : '-1'}"
          data-tab="${esc(tab)}">${tab === 'Favorites' ? '★ ' : ''}${esc(tab)}<span class="tab-count">${count}</span></button>`;
      }).join('');
      nav.scrollLeft = scrollLeft;
      if (hadFocus) nav.querySelector('.tab[aria-selected="true"]').focus();
    }

    function toggleFavorite(number) {
      if (favorites.has(number)) favorites.delete(number);
      else favorites.add(number);
      try { localStorage.setItem(favoritesKey, JSON.stringify([...favorites])); } catch (_) { /* Favorites remain usable for this session. */ }
      render();
    }

    function latest(number) {
      return [...state.runs].reverse().find(r => r.workflow_number === number);
    }

    function render() {
      const normalized = query.trim().toLowerCase();
      renderTabs();
      const visible = state.workflows.filter(w =>
        (normalized || inTab(w, activeTab)) &&
        (!normalized || `${w.number} ${w.name} ${w.description} ${w.category}`.toLowerCase().includes(normalized))
      );
      const grid = document.getElementById('grid');
      grid.innerHTML = visible.length ? visible.map(w => {
        const r = latest(w.number), busy = r && ['starting', 'running'].includes(r.status);
        const detail = w.available ? w.description : `${w.description} ${w.setup}`;
        return `<article class="card" title="${esc(detail)}">
          <div class="num">${w.number}</div>
          <div>
            <h2>${esc(w.name)}</h2>
            <p>${esc(w.description)}</p>
            <div class="meta">
              <span class="tag">${esc(w.category)}</span>
              <span class="tag">${esc(w.safety)}</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="favorite" type="button" data-favorite="${w.number}" aria-pressed="${favorites.has(w.number)}" aria-label="${favorites.has(w.number) ? 'Remove' : 'Add'} ${esc(w.name)} ${favorites.has(w.number) ? 'from' : 'to'} favorites" title="${favorites.has(w.number) ? 'Remove from' : 'Add to'} favorites">${favorites.has(w.number) ? '★' : '☆'}</button>
            <button class="run ${w.available ? '' : 'setup'}" title="${esc(w.setup || w.description)}" ${busy || !w.available ? 'disabled' : ''} onclick="run(${w.number})">${busy ? 'Running' : w.available ? 'Run ' + w.number : 'Setup needed'}</button>
          </div>
          <div class="status ${esc(r?.status || '')}">${r ? esc(r.status) : w.available ? 'Ready to run' : `<span class="setup-note">${esc(w.setup)}</span>`}${r?.open_url && busy ? ` · <a class="open" href="${esc(r.open_url)}" target="_blank">Open UI ↗</a>` : ''}</div>
        </article>`;
      }).join('') : `<div class="empty">${normalized ? 'No workflows match your search.' : activeTab === 'Favorites' ? 'No favorites yet. Open another tab and select ☆ on a workflow.' : 'No workflows in this group.'}</div>`;
      showConsole();
    }

    function showConsole() {
      const r = state.runs.find(x => x.run_id === selectedRun) || state.runs.at(-1);
      if (!r) return;
      selectedRun = r.run_id;
      document.getElementById('consoleTitle').textContent = `Run ${r.run_id} · ${r.name}`;
      document.getElementById('consoleState').textContent = r.status;
      const pre = document.getElementById('logs');
      pre.textContent = (r.logs || []).join('\n') || 'Process started. Waiting for output…';
      pre.scrollTop = pre.scrollHeight;
    }

    async function refresh() {
      const response = await fetch('/api/state', { cache: 'no-store' });
      state = await response.json();
      render();
    }

    async function run(number) {
      const response = await fetch('/api/workflows/' + number + '/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Launcher-Token': token },
        body: JSON.stringify({ confirm: true })
      });
      const data = await response.json();
      if (!response.ok) {
        alert(data.error || 'Unable to start workflow');
        return;
      }
      selectedRun = data.run_id;
      await refresh();
      if (data.open_url) setTimeout(() => window.open(data.open_url, '_blank'), 700);
    }

    function find() {
      query = document.getElementById('call').value;
      const exact = state.workflows.find(w => String(w.number) === query.trim());
      if (exact && exact.available) return run(exact.number);
      render();
    }

    document.getElementById('callButton').onclick = find;
    document.getElementById('tabs').addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]');
      if (!tab) return;
      activeTab = tab.dataset.tab;
      query = '';
      document.getElementById('call').value = '';
      render();
      document.querySelector('.tab[aria-selected="true"]').focus();
    });
    document.getElementById('tabs').addEventListener('keydown', e => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
      const tabs = [...document.querySelectorAll('#tabs .tab')];
      const index = tabs.indexOf(document.activeElement);
      if (index < 0) return;
      e.preventDefault();
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1
        : (index + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].click();
    });
    document.getElementById('grid').addEventListener('click', e => {
      const button = e.target.closest('[data-favorite]');
      if (button) toggleFavorite(Number(button.dataset.favorite));
    });
    document.getElementById('call').addEventListener('input', e => {
      query = e.target.value;
      if (query.trim()) activeTab = 'All';
      render();
    });
    document.getElementById('call').addEventListener('keydown', e => { if (e.key === 'Enter') find(); });
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
